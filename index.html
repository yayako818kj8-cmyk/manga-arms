<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARMS</title>

<style>
  body{
    margin:0;
    overflow:hidden;
    background:#000;
  }

  /* 読了率バー */
  #progress{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:6px;
    background:rgba(255,255,255,0.2);
    z-index:1000;
  }

  #progress-bar{
    width:0%;
    height:100%;
    background:#00ffcc;
  }

  /* マンガ */
  #container{
    display:flex;
    flex-direction:row-reverse;
    height:100vh;

    overflow-x:auto;
    overflow-y:hidden;

    scroll-behavior:smooth;
  }

  .page{
    flex:0 0 100vw;
    height:100vh;
  }

  .page img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }

  /* アンケート */
  #survey{
    flex:0 0 100vw;
    height:100vh;

    background:#fff;
    color:#000;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
  }

  iframe{
    width:90%;
    height:70%;
    border:none;
  }

  /* 縦向き警告 */
  #rotate-message{
    position:fixed;
    inset:0;
    background:#000;
    color:#fff;

    display:none;
    justify-content:center;
    align-items:center;

    text-align:center;
    font-size:1.5rem;
    z-index:9999;
  }

  @media (orientation:portrait){
    #rotate-message{
      display:flex;
    }
  }
</style>
</head>

<body>

<div id="rotate-message">
  このマンガはスマートフォンを横向きにしてご覧ください
</div>

<div id="progress">
  <div id="progress-bar"></div>
</div>

<div id="container"></div>

<script>

const container = document.getElementById("container");
const progressBar = document.getElementById("progress-bar");

/* JSON読み込み */
fetch("pages.json3")
  .then(response => {

    if(!response.ok){
      throw new Error("JSON読込失敗");
    }

    return response.json();
  })

  .then(images => {

    images.forEach(file => {

      const page = document.createElement("div");
      page.className = "page";

      const img = document.createElement("img");

      /* 画像はリポジトリ直下 */
      img.src = "pages3/" + file;
      
      img.loading = "lazy";

      page.appendChild(img);
      container.appendChild(page);

    });

    /* アンケート */
    const survey = document.createElement("div");

    survey.id = "survey";

    survey.innerHTML = `
      <h1>アンケートにご協力ください</h1>
      <p>ご意見は今後の研究に活用します。</p>

      <iframe
        src="https://docs.google.com/forms/d/e/1FAIpQLSfd_d2_oWxpvHFcsp6C2Ie0LSE-QEODlY2OwnPPWjIceXKpBw/viewform?usp=sharing&ouid=107445254052416859927">
      </iframe>
    `;

    container.appendChild(survey);

    /* 最初は右端へ */
    container.scrollLeft = container.scrollWidth;

  })

  .catch(error => {
    console.error(error);

    container.innerHTML = `
      <div style="
        color:white;
        padding:30px;
        font-size:20px;">
        JSONまたは画像の読み込みに失敗しました
      </div>
    `;
  });

/* 読了率 */
container.addEventListener("scroll", () => {

  const maxScroll =
    container.scrollWidth - container.clientWidth;

  if(maxScroll <= 0) return;

  const progress =
    1 - (container.scrollLeft / maxScroll);

  progressBar.style.width =
    (progress * 100) + "%";
});

</script>

</body>
</html>
